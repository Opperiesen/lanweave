name: Controller integration

on:
  workflow_dispatch:
    inputs:
      controller_version:
        description: "Exact UniFi Network version exercised"
        required: true
        type: string
        default: "not-declared"
      unifi_os_version:
        description: "Exact UniFi OS version, or not-applicable"
        required: true
        type: string
        default: "not-applicable"
      api_mode:
        description: "Authentication mode used for this run"
        required: true
        type: choice
        options:
          - local-classic-api-key
          - local-classic-session
        default: local-classic-api-key
      run_mutations:
        description: "Run the separately guarded create/update/delete suite"
        required: true
        type: boolean
        default: false
      run_dns_mutations:
        description: "Run the separately guarded API-key DNS lifecycle suite"
        required: true
        type: boolean
        default: false
      run_firewall_mutations:
        description: "Run the separately guarded API-key firewall lifecycle suite"
        required: true
        type: boolean
        default: false
      run_nat_mutations:
        description: "Run the separately guarded session NAT lifecycle suite"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lanweave-controller-integration
  cancel-in-progress: false

env:
  LANWEAVE_INTEGRATION_HOST: ${{ secrets.UNIFI_HOST }}
  LANWEAVE_INTEGRATION_SITE: ${{ vars.UNIFI_SITE }}
  LANWEAVE_INTEGRATION_API_KEY: ${{ inputs.api_mode == 'local-classic-api-key' && secrets.UNIFI_API_KEY || '' }}
  LANWEAVE_INTEGRATION_USER: ${{ secrets.UNIFI_USER }}
  LANWEAVE_INTEGRATION_PASS: ${{ secrets.UNIFI_PASS }}
  LANWEAVE_INTEGRATION_VERIFY_TLS: ${{ vars.UNIFI_VERIFY_TLS }}
  LANWEAVE_INTEGRATION_CONTROLLER_VERSION: ${{ inputs.controller_version }}
  LANWEAVE_INTEGRATION_OS_VERSION: ${{ inputs.unifi_os_version }}
  LANWEAVE_INTEGRATION_API_MODE: ${{ inputs.api_mode }}

jobs:
  read-only:
    name: read-only probes
    # This workflow is manual-only and runs on the dedicated LAN runner.
    runs-on: [self-hosted, linux, lanweave-unifi]
    timeout-minutes: 15
    environment: unifi-integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify runner toolchain
        run: |
          python3 --version
          uv --version
      - run: uv sync --extra dev --locked
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Run read-only controller and profile probes
        id: probes
        run: >-
          uv run pytest tests/integration/test_controller.py
          tests/integration/test_profile_integration.py -m integration -q
          --junitxml=reports/read-only.xml
      - name: Render compatibility report
        if: always()
        env:
          LANWEAVE_INTEGRATION_STATUS: ${{ steps.probes.outcome }}
          LANWEAVE_INTEGRATION_REPORT_PATH: reports/read-only.md
          LANWEAVE_INTEGRATION_MUTATIONS: "false"
        run: uv run python scripts/render_compatibility_report.py
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lanweave-compatibility-read-only
          path: reports/
          if-no-files-found: error
          retention-days: 14

  cli-read-only:
    name: public CLI read-only matrix
    # Keep the public entry point in a separate report so adapter-level probes
    # cannot accidentally make the CLI surface appear covered.
    runs-on: [self-hosted, linux, lanweave-unifi]
    timeout-minutes: 20
    environment: unifi-integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify runner toolchain
        run: |
          python3 --version
          uv --version
      - run: uv sync --extra dev --locked
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Run installed public CLI matrix
        id: cli
        run: >-
          uv run pytest tests/integration/test_cli_live.py
          -m integration -q --junitxml=reports/cli-read-only.xml
      - name: Render CLI compatibility report
        if: always()
        env:
          LANWEAVE_INTEGRATION_STATUS: ${{ steps.cli.outcome }}
          LANWEAVE_INTEGRATION_REPORT_PATH: reports/cli-read-only.md
          LANWEAVE_INTEGRATION_CLI_MATRIX: "true"
        run: uv run python scripts/render_compatibility_report.py
      - name: Upload CLI compatibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lanweave-compatibility-cli
          path: reports/
          if-no-files-found: error
          retention-days: 14

  mutations:
    name: authorized mutations
    if: ${{ inputs.run_mutations }}
    runs-on: [self-hosted, linux, lanweave-unifi]
    timeout-minutes: 15
    environment: unifi-integration
    env:
      LANWEAVE_INTEGRATION_MUTATIONS: "true"
      LANWEAVE_INTEGRATION_API_KEY: ""
      LANWEAVE_INTEGRATION_USER: ${{ secrets.UNIFI_MUTATION_USER }}
      LANWEAVE_INTEGRATION_PASS: ${{ secrets.UNIFI_MUTATION_PASS }}
      LANWEAVE_INTEGRATION_MUTATION_CONFIRM: ${{ secrets.LANWEAVE_INTEGRATION_MUTATION_CONFIRM }}
      LANWEAVE_INTEGRATION_MUTATION_PREFIX: ${{ vars.LANWEAVE_MUTATION_PREFIX }}
      LANWEAVE_INTEGRATION_MUTATION_SUBNET: ${{ vars.LANWEAVE_MUTATION_SUBNET }}
      LANWEAVE_INTEGRATION_MUTATION_VLAN: ${{ vars.LANWEAVE_MUTATION_VLAN }}
      LANWEAVE_INTEGRATION_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify runner toolchain
        run: |
          python3 --version
          uv --version
      - run: uv sync --extra dev --locked
      - name: Verify mutation authorization guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${LANWEAVE_INTEGRATION_API_MODE}" != "local-classic-session" ]]; then
            echo "::error::Mutations require api_mode=local-classic-session."
            exit 1
          fi
          if [[ "${LANWEAVE_INTEGRATION_MUTATION_CONFIRM}" != "I_UNDERSTAND" ]]; then
            echo "::error::The mutation confirmation secret is not set to the required value."
            exit 1
          fi
          if [[ -z "${LANWEAVE_INTEGRATION_HOST}" || ( -z "${LANWEAVE_INTEGRATION_API_KEY}" && ( -z "${LANWEAVE_INTEGRATION_USER}" || -z "${LANWEAVE_INTEGRATION_PASS}" ) ) ]]; then
            echo "::error::Controller credentials are required when mutations are enabled."
            exit 1
          fi
          case "${LANWEAVE_INTEGRATION_MUTATION_PREFIX}" in
            lanweave-ci-*) ;;
            *) echo "::error::The mutation prefix must start with lanweave-ci-."; exit 1 ;;
          esac
          if [[ -z "${LANWEAVE_INTEGRATION_MUTATION_SUBNET}" || -z "${LANWEAVE_INTEGRATION_MUTATION_VLAN}" ]]; then
            echo "::error::Mutation subnet and VLAN environment variables are required."
            exit 1
          fi
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Run authorized controller mutations
        id: mutations
        run: >-
          uv run pytest tests/integration/test_mutations.py
          tests/integration/test_cli_mutations.py -m integration_mutation -q
          --junitxml=reports/mutations.xml
      - name: Render mutation report
        if: always()
        env:
          LANWEAVE_INTEGRATION_STATUS: ${{ steps.mutations.outcome }}
          LANWEAVE_INTEGRATION_REPORT_PATH: reports/mutations.md
          LANWEAVE_INTEGRATION_CLI_MATRIX: "true"
        run: uv run python scripts/render_compatibility_report.py
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lanweave-compatibility-mutations
          path: reports/
          if-no-files-found: error
          retention-days: 14

  dns-mutations:
    name: authorized DNS mutations
    if: ${{ inputs.run_dns_mutations }}
    runs-on: [self-hosted, linux, lanweave-unifi]
    timeout-minutes: 15
    environment: unifi-integration
    env:
      LANWEAVE_INTEGRATION_DNS_MUTATIONS: "true"
      LANWEAVE_INTEGRATION_DNS_MUTATION_CONFIRM: ${{ secrets.LANWEAVE_INTEGRATION_DNS_MUTATION_CONFIRM }}
      LANWEAVE_INTEGRATION_DNS_MUTATION_PREFIX: ${{ vars.LANWEAVE_DNS_MUTATION_PREFIX }}
      LANWEAVE_INTEGRATION_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify runner toolchain
        run: |
          python3 --version
          uv --version
      - run: uv sync --extra dev --locked
      - name: Verify DNS mutation authorization guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${LANWEAVE_INTEGRATION_API_MODE}" != "local-classic-api-key" ]]; then
            echo "::error::DNS mutations require api_mode=local-classic-api-key."
            exit 1
          fi
          if [[ "${LANWEAVE_INTEGRATION_DNS_MUTATION_CONFIRM}" != "I_UNDERSTAND" ]]; then
            echo "::error::The DNS mutation confirmation secret is not set to the required value."
            exit 1
          fi
          if [[ -z "${LANWEAVE_INTEGRATION_HOST}" || -z "${LANWEAVE_INTEGRATION_API_KEY}" ]]; then
            echo "::error::A controller host and API key are required for DNS mutations."
            exit 1
          fi
          case "${LANWEAVE_INTEGRATION_DNS_MUTATION_PREFIX}" in
            lanweave-ci-*) ;;
            *) echo "::error::The DNS mutation prefix must start with lanweave-ci-."; exit 1 ;;
          esac
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Run authorized DNS lifecycle
        id: dns_mutations
        run: >-
          uv run pytest tests/integration/test_dns_mutations.py
          -m integration_mutation -q --junitxml=reports/dns-mutations.xml
      - name: Render DNS mutation report
        if: always()
        env:
          LANWEAVE_INTEGRATION_STATUS: ${{ steps.dns_mutations.outcome }}
          LANWEAVE_INTEGRATION_REPORT_PATH: reports/dns-mutations.md
          LANWEAVE_INTEGRATION_MUTATIONS: "true"
        run: uv run python scripts/render_compatibility_report.py
      - name: Upload DNS mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lanweave-compatibility-dns-mutations
          path: reports/
          if-no-files-found: error
          retention-days: 14

  firewall-mutations:
    name: authorized firewall mutations
    if: ${{ inputs.run_firewall_mutations }}
    runs-on: [self-hosted, linux, lanweave-unifi]
    timeout-minutes: 15
    environment: unifi-integration
    env:
      LANWEAVE_INTEGRATION_FIREWALL_MUTATIONS: "true"
      LANWEAVE_INTEGRATION_FIREWALL_MUTATION_CONFIRM: ${{ secrets.LANWEAVE_INTEGRATION_FIREWALL_MUTATION_CONFIRM }}
      LANWEAVE_INTEGRATION_FIREWALL_MUTATION_PREFIX: ${{ vars.LANWEAVE_FIREWALL_MUTATION_PREFIX }}
      LANWEAVE_INTEGRATION_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify runner toolchain
        run: |
          python3 --version
          uv --version
      - run: uv sync --extra dev --locked
      - name: Verify firewall mutation authorization guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${LANWEAVE_INTEGRATION_API_MODE}" != "local-classic-api-key" ]]; then
            echo "::error::Firewall mutations require api_mode=local-classic-api-key."
            exit 1
          fi
          if [[ "${LANWEAVE_INTEGRATION_FIREWALL_MUTATION_CONFIRM}" != "I_UNDERSTAND" ]]; then
            echo "::error::The firewall mutation confirmation secret is not set to the required value."
            exit 1
          fi
          if [[ -z "${LANWEAVE_INTEGRATION_HOST}" || -z "${LANWEAVE_INTEGRATION_API_KEY}" ]]; then
            echo "::error::A controller host and API key are required for firewall mutations."
            exit 1
          fi
          case "${LANWEAVE_INTEGRATION_FIREWALL_MUTATION_PREFIX}" in
            lanweave-ci-*) ;;
            *) echo "::error::The firewall mutation prefix must start with lanweave-ci-."; exit 1 ;;
          esac
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Run authorized firewall lifecycle
        id: firewall_mutations
        run: >-
          uv run pytest tests/integration/test_firewall_mutations.py
          -m integration_mutation -q --junitxml=reports/firewall-mutations.xml
      - name: Render firewall mutation report
        if: always()
        env:
          LANWEAVE_INTEGRATION_STATUS: ${{ steps.firewall_mutations.outcome }}
          LANWEAVE_INTEGRATION_REPORT_PATH: reports/firewall-mutations.md
          LANWEAVE_INTEGRATION_FIREWALL_MUTATIONS: "true"
        run: uv run python scripts/render_compatibility_report.py
      - name: Upload firewall mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lanweave-compatibility-firewall-mutations
          path: reports/
          if-no-files-found: error
          retention-days: 14

  nat-mutations:
    name: authorized NAT mutations
    if: ${{ inputs.run_nat_mutations }}
    runs-on: [self-hosted, linux, lanweave-unifi]
    timeout-minutes: 15
    environment: unifi-integration
    env:
      LANWEAVE_INTEGRATION_NAT_MUTATIONS: "true"
      LANWEAVE_INTEGRATION_API_KEY: ""
      LANWEAVE_INTEGRATION_USER: ${{ secrets.UNIFI_MUTATION_USER }}
      LANWEAVE_INTEGRATION_PASS: ${{ secrets.UNIFI_MUTATION_PASS }}
      LANWEAVE_INTEGRATION_NAT_MUTATION_CONFIRM: ${{ secrets.LANWEAVE_INTEGRATION_MUTATION_CONFIRM }}
      LANWEAVE_INTEGRATION_NAT_MUTATION_PREFIX: ${{ vars.LANWEAVE_MUTATION_PREFIX }}
      LANWEAVE_INTEGRATION_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify runner toolchain
        run: |
          python3 --version
          uv --version
      - run: uv sync --extra dev --locked
      - name: Verify NAT mutation authorization guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${LANWEAVE_INTEGRATION_API_MODE}" != "local-classic-session" ]]; then
            echo "::error::NAT mutations require api_mode=local-classic-session."
            exit 1
          fi
          if [[ "${LANWEAVE_INTEGRATION_NAT_MUTATION_CONFIRM}" != "I_UNDERSTAND" ]]; then
            echo "::error::The NAT mutation confirmation secret is not set to the required value."
            exit 1
          fi
          if [[ -z "${LANWEAVE_INTEGRATION_HOST}" || -z "${LANWEAVE_INTEGRATION_USER}" || -z "${LANWEAVE_INTEGRATION_PASS}" ]]; then
            echo "::error::A controller host and session credentials are required for NAT mutations."
            exit 1
          fi
          case "${LANWEAVE_INTEGRATION_NAT_MUTATION_PREFIX}" in
            lanweave-ci-*) ;;
            *) echo "::error::The NAT mutation prefix must start with lanweave-ci-."; exit 1 ;;
          esac
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Run authorized NAT lifecycle
        id: nat_mutations
        run: >-
          uv run pytest tests/integration/test_nat_mutations.py
          -m integration_mutation -q --junitxml=reports/nat-mutations.xml
      - name: Render NAT mutation report
        if: always()
        env:
          LANWEAVE_INTEGRATION_STATUS: ${{ steps.nat_mutations.outcome }}
          LANWEAVE_INTEGRATION_REPORT_PATH: reports/nat-mutations.md
        run: uv run python scripts/render_compatibility_report.py
      - name: Upload NAT mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lanweave-compatibility-nat-mutations
          path: reports/
          if-no-files-found: error
          retention-days: 14
