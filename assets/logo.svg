<svg
  xmlns="http://www.w3.org/2000/svg"
  width="640"
  height="180"
  viewBox="0 0 640 180"
  role="img"
  aria-labelledby="lanweave-title lanweave-description"
>
  <title id="lanweave-title">Lanweave</title>
  <desc id="lanweave-description">
    A minimal woven W symbol beside the Lanweave wordmark.
  </desc>

  <rect x="2" y="2" width="636" height="176" rx="42" fill="#0B1F2A" />

  <g
    id="lanweave-mark"
    fill="none"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M44 48 74 132" stroke="#F1F6F7" />
    <path d="m74 132 30-68" stroke="#35C8B8" />
    <path d="m104 64 30 68" stroke="#F1F6F7" />
    <path d="m134 132 30-84" stroke="#35C8B8" />
  </g>

  <g
    id="lanweave-wordmark"
    font-family="Avenir Next, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="72"
    letter-spacing="-3.5"
    aria-hidden="true"
  >
    <text x="214" y="113" fill="#F1F6F7" font-weight="650">Lanweave</text>
  </g>
</svg>
