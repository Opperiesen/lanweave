name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild and publish"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  ci:
    name: required CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: build and attest
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          enable-cache: false
      - name: Verify tag and project version
        run: python scripts/verify_release.py "$RELEASE_TAG"
      - name: Build wheel and source distribution
        run: |
          rm -rf dist
          uv build
      - name: Verify release artifacts
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          python scripts/verify_release_artifacts.py "$version" dist
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Install wheel in a clean environment
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          venv="$RUNNER_TEMP/lanweave-release-wheel"
          uv venv --python 3.11 "$venv"
          uv pip install --python "$venv/bin/python" "dist/lanweave-${version}-py3-none-any.whl"
          test "$("$venv/bin/lanweave" --version)" = "$version"
      - name: Install source distribution in a clean environment
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          venv="$RUNNER_TEMP/lanweave-release-sdist"
          uv venv --python 3.11 "$venv"
          uv pip install --python "$venv/bin/python" "dist/lanweave-${version}.tar.gz"
          test "$("$venv/bin/lanweave" --version)" = "$version"
      - name: Generate artifact provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Add provenance bundle to release assets
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          bundle="dist/lanweave-${RELEASE_TAG#v}-provenance.intoto.jsonl"
          cp "$PROVENANCE_BUNDLE" "$bundle"
          test -s "$bundle"
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lanweave-release-${{ env.RELEASE_TAG }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*-provenance.intoto.jsonl
          if-no-files-found: error
          retention-days: 7
      - name: Upload PyPI distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lanweave-pypi-${{ env.RELEASE_TAG }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  pypi:
    name: publish to PyPI
    needs: build
    if: >-
      ${{
        needs.build.result == 'success'
        && !contains(inputs.tag || github.ref_name, 'a')
        && !contains(inputs.tag || github.ref_name, 'b')
        && !contains(inputs.tag || github.ref_name, 'rc')
      }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lanweave
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download PyPI distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lanweave-pypi-${{ env.RELEASE_TAG }}
          path: dist
      - name: Publish package with Trusted Publishing
        uses: docker://ghcr.io/pypa/gh-action-pypi-publish@sha256:5c2f7030fbef8308068eb4cc9080fd3c9e157ccf6d511924d69f8f4b23dc95c # pypa/gh-action-pypi-publish v1.14.2
        with:
          user: __token__
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
          verify-metadata: true
          print-hash: true
          attestations: true

  github-release:
    name: publish GitHub release
    needs: [build, pypi]
    if: >-
      ${{
        always()
        && needs.build.result == 'success'
        && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lanweave-release-${{ env.RELEASE_TAG }}
          path: dist
      - name: Publish draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          release_args=(
            --repo "$REPOSITORY"
            --verify-tag
            --draft
            --title "Lanweave $version"
            --generate-notes
          )
          expected_prerelease=false
          if [[ "$RELEASE_TAG" =~ (a|b|rc)[0-9]+$ ]]; then
            release_args+=(--prerelease)
            expected_prerelease=true
          fi
          if existing="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<<"$existing")" != "true" ]]; then
              echo "A published release already exists for $RELEASE_TAG." >&2
              exit 1
            fi
            if [[ "$expected_prerelease" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --prerelease
            fi
          else
            gh release create "$RELEASE_TAG" "${release_args[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --repo "$REPOSITORY" --clobber
          for asset in dist/*; do
            gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets \
              --jq '.assets[].name' | grep -Fxq "$(basename "$asset")"
          done
          release_state="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft,isPrerelease)"
          test "$(jq -r '.isDraft' <<<"$release_state")" = "true"
          test "$(jq -r '.isPrerelease' <<<"$release_state")" = "$expected_prerelease"
          gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false
