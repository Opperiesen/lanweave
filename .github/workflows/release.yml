name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Annotated release tag to rebuild and publish; CI uses this exact tag"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  ci:
    name: required CI
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      head_sha: ${{ inputs.tag || github.sha }}
    permissions:
      contents: read

  build:
    name: build and attest
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for PyPI Trusted Publishing and build provenance.
      attestations: write # Required to publish the GitHub artifact attestation.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Verify tag and project version
        run: python scripts/verify_release.py "$RELEASE_TAG"
      - name: Verify v0.5 firewall evidence gate
        env:
          LANWEAVE_REQUIRE_V050_LIVE_EVIDENCE: "true"
        run: uv run python scripts/verify_v050_evidence.py
      - name: Verify v0.6 NAT evidence gate
        env:
          LANWEAVE_REQUIRE_V060_LIVE_EVIDENCE: "true"
        run: uv run python scripts/verify_v060_evidence.py
      - name: Verify v0.7 VPN evidence gate
        run: uv run python scripts/verify_v070_evidence.py
      - name: Verify v0.8 audit evidence gate
        run: uv run python scripts/verify_v080_evidence.py
      - name: Verify v0.9 convergence evidence gate
        run: uv run python scripts/verify_v090_evidence.py
      - name: Verify v1.0 evidence gate
        run: uv run python scripts/verify_v100_evidence.py
      - name: Build wheel and source distribution
        run: |
          rm -rf dist
          uv build
      - name: Verify release artifacts
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          python scripts/verify_release_artifacts.py "$version" dist
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Generate artifact provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Add provenance bundle to release assets
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          bundle="dist/lanweave-${RELEASE_TAG#v}-provenance.intoto.jsonl"
          cp "$PROVENANCE_BUNDLE" "$bundle"
          test -s "$bundle"
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lanweave-release-${{ env.RELEASE_TAG }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*-provenance.intoto.jsonl
          if-no-files-found: error
          retention-days: 7
      - name: Upload PyPI distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lanweave-pypi-${{ env.RELEASE_TAG }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  clean-install-matrix:
    name: clean install (${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lanweave-release-${{ env.RELEASE_TAG }}
          path: dist
      - name: Install wheel and source distribution in clean environments
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          wheel_venv="$RUNNER_TEMP/lanweave-release-wheel"
          sdist_venv="$RUNNER_TEMP/lanweave-release-sdist"
          mcp_venv="$RUNNER_TEMP/lanweave-release-mcp"
          uv venv --python "$PYTHON_VERSION" "$wheel_venv"
          uv pip install --python "$wheel_venv/bin/python" \
            "dist/lanweave-${version}-py3-none-any.whl"
          test "$("$wheel_venv/bin/lanweave" --version)" = "$version"
          uv venv --python "$PYTHON_VERSION" "$sdist_venv"
          uv pip install --python "$sdist_venv/bin/python" \
            "dist/lanweave-${version}.tar.gz"
          test "$("$sdist_venv/bin/lanweave" --version)" = "$version"
          uv venv --python "$PYTHON_VERSION" "$mcp_venv"
          uv pip install --python "$mcp_venv/bin/python" \
            "dist/lanweave-${version}-py3-none-any.whl[mcp]"
          test -x "$mcp_venv/bin/lanweave-mcp"
          "$mcp_venv/bin/python" -c 'import lanweave.mcp; import mcp'

  pypi:
    name: publish to PyPI
    needs: [build, clean-install-matrix]
    if: >-
      ${{
        needs.build.result == 'success'
        && needs.clean-install-matrix.result == 'success'
        && !contains(inputs.tag || github.ref_name, 'a')
        && !contains(inputs.tag || github.ref_name, 'b')
        && !contains(inputs.tag || github.ref_name, 'rc')
      }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lanweave
    permissions:
      contents: read
      id-token: write # Required for PyPI Trusted Publishing.
    steps:
      - name: Download PyPI distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lanweave-pypi-${{ env.RELEASE_TAG }}
          path: dist
      - name: Publish package with Trusted Publishing
        uses: docker://ghcr.io/pypa/gh-action-pypi-publish@sha256:5c2f7030fbef8308068eb4cc9080fd3c9e157ccf6d511924d69f8f4b23dc95c1 # pypa/gh-action-pypi-publish v1.14.2
        with:
          user: __token__
          password: ""
          verbose: true
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
          verify-metadata: true
          print-hash: true
          attestations: true

  github-release:
    name: publish GitHub release
    needs: [build, clean-install-matrix, pypi]
    if: >-
      ${{
        always()
        && needs.build.result == 'success'
        && needs.clean-install-matrix.result == 'success'
        && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub release and upload assets.
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lanweave-release-${{ env.RELEASE_TAG }}
          path: dist
      - name: Publish draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          release_args=(
            --repo "$REPOSITORY"
            --verify-tag
            --draft
            --title "Lanweave $version"
            --generate-notes
          )
          expected_prerelease=false
          if [[ "$RELEASE_TAG" =~ (a|b|rc)[0-9]+$ ]]; then
            release_args+=(--prerelease)
            expected_prerelease=true
          fi
          if existing="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<<"$existing")" != "true" ]]; then
              echo "A published release already exists for $RELEASE_TAG." >&2
              exit 1
            fi
            if [[ "$expected_prerelease" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --prerelease
            fi
          else
            gh release create "$RELEASE_TAG" "${release_args[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --repo "$REPOSITORY" --clobber
          for asset in dist/*; do
            gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets \
              --jq '.assets[].name' | grep -Fxq "$(basename "$asset")"
          done
          release_state="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft,isPrerelease)"
          test "$(jq -r '.isDraft' <<<"$release_state")" = "true"
          test "$(jq -r '.isPrerelease' <<<"$release_state")" = "$expected_prerelease"
          gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false

  post-publication:
    name: verify public release
    needs: [build, clean-install-matrix, pypi, github-release]
    if: >-
      ${{
        always()
        && needs.build.result == 'success'
        && needs.clean-install-matrix.result == 'success'
        && needs.github-release.result == 'success'
        && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Download public GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --dir release-assets
      - name: Verify tag, assets, checksums and PyPI metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected_commit="$(git rev-parse HEAD)"
          verify_args=("$RELEASE_TAG" "$REPOSITORY" "$expected_commit" --asset-dir release-assets)
          if [[ "${{ needs.pypi.result }}" == "skipped" ]]; then
            verify_args+=(--skip-pypi)
          fi
          python scripts/verify_publication.py "${verify_args[@]}"
      - name: Verify GitHub artifact attestation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh attestation verify \
            "release-assets/lanweave-${version}-py3-none-any.whl" \
            --repo "$REPOSITORY" \
            --source-ref "refs/tags/$RELEASE_TAG" \
            --signer-workflow "$REPOSITORY/.github/workflows/release.yml"
      - name: Verify PyPI attestations cryptographically
        if: needs.pypi.result == 'success'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for artifact in \
            "pypi:lanweave-${version}-py3-none-any.whl" \
            "pypi:lanweave-${version}.tar.gz"; do
            uvx --from pypi-attestations pypi-attestations verify pypi \
              --repository "https://github.com/$REPOSITORY" "$artifact"
          done
