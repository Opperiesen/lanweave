[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lanweave"
version = "0.1.0a2"
description = "Safe, declarative configuration and diagnostics for local UniFi Network controllers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
keywords = ["unifi", "network-automation", "gitops", "mcp", "infrastructure-as-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
]
dependencies = [
    "httpx>=0.28,<1",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.15,<1",
]
mcp = [
    "mcp>=1,<2",
]

[project.scripts]
lanweave = "lanweave.cli:main"
lanweave-mcp = "lanweave.mcp:main"

[project.urls]
Homepage = "https://github.com/Opperiesen/lanweave"
Repository = "https://github.com/Opperiesen/lanweave"
Issues = "https://github.com/Opperiesen/lanweave/issues"
Changelog = "https://github.com/Opperiesen/lanweave/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/lanweave"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live controller read-only integration tests",
    "integration_mutation: explicitly authorized live controller mutation tests",
]
