[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "unifi-network-tools"
version = "0.1.0a1"
description = "Safe, declarative configuration and diagnostics for local UniFi Network controllers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "httpx>=0.28,<1",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.15,<1",
]

[project.scripts]
unifi-tools = "unifi_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unifi_tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
